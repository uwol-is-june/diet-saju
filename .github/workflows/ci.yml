name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연속 푸시하면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # 사주 계산 테스트가 여기 포함된다. 만세력 로직 회귀를 막는 그물이다.
      - run: npm test

      # API 키 없이도 빌드가 성공해야 한다 (env 검증이 lazy 인 이유).
      - run: npm run build
