<!doctype html>
<!--
  공유 카드(og:image)의 원본 — TASK-10.

  결과물은 `app/opengraph-image.png` 로 커밋되어 있고 Next 가 자동으로 메타 태그를 붙인다.
  런타임에 생성하지 않는 이유: `next/og`(satori)는 폰트 데이터를 직접 넣어 줘야 하고
  기본 폰트에 한글 글리프가 없다. 개인 결과가 아닌 고정 카드라 미리 그려 두는 편이 낫다.

  ## 고치는 방법

  이 파일을 수정한 뒤 1200×630 으로 렌더해 `app/opengraph-image.png` 로 저장한다.
  (헤드리스 브라우저로 스크린샷하면 된다 — 예: Playwright 의 `page.screenshot`)

  ## 색

  아래 팔레트는 `app/globals.css` 에서 **복사한 값**이다. 단일 소스는 그쪽이고,
  두 값이 어긋나면 `lib/design/tokens.test.ts` 가 실패한다. 임의로 바꾸지 말 것.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --raw-green-500: #50d88f;
        --raw-green-50: #eafaf2;
        --raw-green-700: #1c7d4a;
        --raw-gray-900: #181a1b;
        --raw-gray-500: #6d676c;
        --raw-white-warm: #fdfffb;
        --raw-ohaeng-mok-bg: #e5f4ec;
        --raw-ohaeng-hwa-bg: #ffe7e9;
        --raw-ohaeng-to-bg: #fef8e6;
        --raw-ohaeng-geum-bg: #ededed;
        --raw-ohaeng-su-bg: #e7f0ff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: var(--raw-white-warm);
        color: var(--raw-gray-900);
        font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui,
          "Segoe UI", "Malgun Gothic", sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 88px;
        position: relative;
        overflow: hidden;
      }
      .bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 16px;
        background: var(--raw-green-500);
      }
      .wordmark {
        color: var(--raw-green-700);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.32em;
        margin-bottom: 26px;
      }
      h1 {
        font-size: 82px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      p {
        margin-top: 26px;
        font-size: 32px;
        line-height: 1.5;
        color: var(--raw-gray-500);
      }
      .badges {
        display: flex;
        gap: 14px;
        margin-top: 46px;
      }
      .badge {
        width: 86px;
        height: 86px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        font-weight: 700;
        color: var(--raw-green-700);
      }
      .mok { background: var(--raw-ohaeng-mok-bg); }
      .hwa { background: var(--raw-ohaeng-hwa-bg); }
      .to { background: var(--raw-ohaeng-to-bg); }
      .geum { background: var(--raw-ohaeng-geum-bg); }
      .su { background: var(--raw-ohaeng-su-bg); }
      .pillars {
        position: absolute;
        right: 88px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        gap: 16px;
      }
      .pillar {
        width: 104px;
        height: 200px;
        border-radius: 26px;
        background: var(--raw-green-50);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 52px;
        font-weight: 700;
        color: var(--raw-green-700);
        line-height: 1.15;
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div class="wordmark">DIET SAJU</div>
    <h1>사주로 읽는<br />나의 기질</h1>
    <p>생년월일시로 사주 원국을 계산하고,<br />오행 균형으로 기질과 생활 습관을 풀어드립니다.</p>
    <div class="badges">
      <div class="badge mok">목</div>
      <div class="badge hwa">화</div>
      <div class="badge to">토</div>
      <div class="badge geum">금</div>
      <div class="badge su">수</div>
    </div>
    <div class="pillars">
      <div class="pillar"><span>경</span><span>오</span></div>
      <div class="pillar"><span>신</span><span>사</span></div>
    </div>
  </body>
</html>
